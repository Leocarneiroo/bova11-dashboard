## CONCEITOS E FÓRMULAS VITAIS (Para entendimento da IA)

### 1. Demanda Institucional e PDI (Módulo 17)
- **ADI (Aggregate Demand Index)**: Mede o fluxo total (0.4*Skew + 0.3*Premium_Imbalance + 0.2*OI_Flow + 0.1*Vol_Imbalance). 
  * > +0.02 = Puts demand, Hedging (Bearish/Proteção).
  * < -0.02 = Calls demand, Risk-on (Bullish).
- **PDI (Put Demand Index)**: \`ΔSkew * ΔIV_ATM\`. Avalia a aceleração na demanda por proteção.
  * Hedge: Puts em demanda + IV subindo (medo agudo).
  * Defensive: Puts em demanda mas IV caindo.
- **IDS (Institutional Demand Score)**: Z-score integrado de 7 variáveis (Skew, Premium, OI, IV, GEX, Charm, Vanna). \`> +0.5 = Bear, < -0.5 = Bull\`.
- **DFP (Delta Flow Proxy)**: Proxy do Delta-adjusted flow em Notional Net.

### 2. Max Pain e Gravitação (Módulos 11 e 12)
- **Max Pain**: Preço de máxima dor para lançadores de opções (onde menor \$ é pago em expiração). O preço tende a ser atraído pra cá perto do vencimento.
- **Mapa Gravitacional (Convergência)**: Distância e alinhamento do Spot com 3 centros de gravidade:
  * μOI = Ponto médio ponderado pelo Open Interest.
  * μGEX = Ponto médio ponderado pelo Gamma Exposure.
  * μDEX = Ponto médio ponderado pelo Delta Exposure.
  * **Score de Convergência (0-100)**: Quanto mais alinhados os três, maior o poder gravitacional. > 75 = Risco centralizado e atração forte.

### 3. Convexidade e Gregos (Módulos 4 e 7 - GEX, Vanna, Charm, TEX, DEX, VEX)
- **GEX (Gamma Exposure)**: Exposição de Gamma líquida dos Dealers. 
  * GEX Positivo (>0): Dealers vendem na alta, compram na baixa. Comprime a volatilidade e consolida o mercado.
  * GEX Negativo (<0): Dealers compram na alta, vendem na baixa. Aumenta a volatilidade e gera "squeezes".
  * **GEX Flip**: Preço exato onde o GEX muda de sinal (regime de volatilidade inverte).
- **DEX (Delta Exposure)**: Exposição direcional por strike. Delta agrupado projeta "Walls".
- **VEX (Vega Exposure)**: Exposição de volatilidade a variações de IV.
- **TEX (Theta Exposure)**: Fluxo de dinheiro diário por decaimento de tempo.
- **Vanna**: Mudança de Delta em função da Volatilidade. Mede risco não-linear direcional.
- **Charm**: Mudança de Delta em função do Tempo. Causa o "Charm rally" em que puts expiram worthless. Vanna + Charm = Ventos favoráveis (Tailwinds) do Gamma.

### 4. Trade Score Institucional (Módulo 5 e 6)
- Avalia cada Opção listada em vários eixos (Liquidez, OI Edge, Vol Edge, GEX Imbalance, Delta/Teta, Distância do Max Pain).
- Gera o **Quality Score (0-100)**. Opções com score alto representam melhores "plays" de mercado, pois têm suporte do Market Maker.
- Institucional Bias analisa o net pressure (comprado em call vs put) nos block trades da B3.

### 5. Prediction e Dinâmica de Skew (Módulos 8, 9, 10, 14, 16)
- **IV Skew Signal v2**: Sinal composto por \`W1*ΔSkew_norm + W2*Z-Score + W3*Aceleração\`, com suavização por MMA.
  * Agregação diária por vencimento usa \`peso = volume_real * fator_DTE\`.
  * DTE curto é filtrado/penalizado para reduzir ruído de pin risk e microestrutura.
  * VOL/OI gera fator de confiança (0.5x a 1.5x) e ajuste direcional (±0.10), diferenciando fluxo real de proteção vs lançamento.
  * Convenção: \`Sinal > 0 = Bearish\` e \`Sinal < 0 = Bullish\`.
- **Hunter Walls**: Agregações severas de volume intradiário. Indica onde "Predadores" agem e travam book.
- **Evolução do GEX History**: O crescimento repentino num strike vira imã de preço.
- **OI Stats**: Distribuição Lognormal das probabililidades.
- **Bandas Reais de Volatilidade**: Modelos GARCH aplicados contra a IV. Se o spot atinge a banda superior do Garch e a IV contrai = Topo.

        const resumoText = `## CONCEITOS E FÓRMULAS VITAIS (Para entendimento da IA)

### 1. Demanda Institucional e PDI (Módulo 17)
- **ADI (Aggregate Demand Index)**: Mede o fluxo total (0.4*Skew + 0.3*Premium_Imbalance + 0.2*OI_Flow + 0.1*Vol_Imbalance). 
  * > +0.02 = Puts demand, Hedging (Bearish/Proteção).
  * < -0.02 = Calls demand, Risk-on (Bullish).
- **PDI (Put Demand Index)**: \`ΔSkew * ΔIV_ATM\`. Avalia a aceleração na demanda por proteção.
  * Hedge: Puts em demanda + IV subindo (medo agudo).
  * Defensive: Puts em demanda mas IV caindo.
- **IDS (Institutional Demand Score)**: Z-score integrado de 7 variáveis (Skew, Premium, OI, IV, GEX, Charm, Vanna). \`> +0.5 = Bear, < -0.5 = Bull\`.
- **DFP (Delta Flow Proxy)**: Proxy do Delta-adjusted flow em Notional Net.

### 2. Max Pain e Gravitação (Módulos 11 e 12)
- **Max Pain**: Preço de máxima dor para lançadores de opções (onde menor \$ é pago em expiração). O preço tende a ser atraído pra cá perto do vencimento.
- **Mapa Gravitacional (Convergência)**: Distância e alinhamento do Spot com 3 centros de gravidade:
  * μOI = Ponto médio ponderado pelo Open Interest.
  * μGEX = Ponto médio ponderado pelo Gamma Exposure.
  * μDEX = Ponto médio ponderado pelo Delta Exposure.
  * **Score de Convergência (0-100)**: Quanto mais alinhados os três, maior o poder gravitacional. > 75 = Risco centralizado e atração forte.

### 3. Convexidade e Gregos (Módulos 4 e 7 - GEX, Vanna, Charm, TEX, DEX, VEX)
- **GEX (Gamma Exposure)**: Exposição de Gamma líquida dos Dealers. 
  * GEX Positivo (>0): Dealers vendem na alta, compram na baixa. Comprime a volatilidade e consolida o mercado.
  * GEX Negativo (<0): Dealers compram na alta, vendem na baixa. Aumenta a volatilidade e gera "squeezes".
  * **GEX Flip**: Preço exato onde o GEX muda de sinal (regime de volatilidade inverte).
- **DEX (Delta Exposure)**: Exposição direcional por strike. Delta agrupado projeta "Walls".
- **VEX (Vega Exposure)**: Exposição de volatilidade a variações de IV.
- **TEX (Theta Exposure)**: Fluxo de dinheiro diário por decaimento de tempo.
- **Vanna**: Mudança de Delta em função da Volatilidade. Mede risco não-linear direcional.
- **Charm**: Mudança de Delta em função do Tempo. Causa o "Charm rally" em que puts expiram worthless. Vanna + Charm = Ventos favoráveis (Tailwinds) do Gamma.

### 4. Trade Score Institucional (Módulo 5 e 6)
- Avalia cada Opção listada em vários eixos (Liquidez, OI Edge, Vol Edge, GEX Imbalance, Delta/Teta, Distância do Max Pain).
- Gera o **Quality Score (0-100)**. Opções com score alto representam melhores "plays" de mercado, pois têm suporte do Market Maker.
- Institucional Bias analisa o net pressure (comprado em call vs put) nos block trades da B3.

### 5. Prediction e Dinâmica de Skew (Módulos 8, 9, 10, 14, 16)
- **IV Skew Signal v2**: Sinal composto por \`W1*ΔSkew_norm + W2*Z-Score + W3*Aceleração\`, com suavização por MMA.
  * Agregação diária por vencimento usa \`peso = volume_real * fator_DTE\`.
  * DTE curto é filtrado/penalizado para reduzir ruído de pin risk e microestrutura.
  * VOL/OI gera fator de confiança (0.5x a 1.5x) e ajuste direcional (±0.10), diferenciando fluxo real de proteção vs lançamento.
  * Convenção: \`Sinal > 0 = Bearish\` e \`Sinal < 0 = Bullish\`.
- **Hunter Walls**: Agregações severas de volume intradiário. Indica onde "Predadores" agem e travam book.
- **Evolução do GEX History**: O crescimento repentino num strike vira imã de preço.
- **OI Stats**: Distribuição Lognormal das probabililidades.
- **Bandas Reais de Volatilidade**: Modelos GARCH aplicados contra a IV. Se o spot atinge a banda superior do Garch e a IV contrai = Topo.

---`;

        let currentFile = files[0];
        let isFullView = false;

        // Renderizar markdown para HTML
        function render(text) {
            let html = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
            html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
            html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
            html = html.replace(/```([a-z]*)\n([\s\S]*?)```/g, '<pre><code class="lang-$1">$2</code></pre>');
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            html = html.replace(/^---$/gim, '<hr>');
            html = html.replace(/^- (.*$)/gim, '<li>$1</li>');
            html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
            document.getElementById('viewer').innerHTML = html;
        }

        function updateStatus() {
            const statusDiv = document.getElementById('status-container');
            const viewMode = isFullView ? 'Dados Completos' : 'Resumo (Conceitos)';
            statusDiv.innerHTML = `<div class="status-msg status-info">📄 ${currentFile} — ${viewMode}</div>`;
        }

        function showContent() {
            const content = isFullView ? fullText : resumoText;
            render(content);
            updateStatus();
        }

        (function() {
            try {
                const saved = localStorage.getItem('bova11-theme');
                if (saved === 'light' || saved === 'dark') {
                    document.documentElement.setAttribute('data-theme', saved);
                }
            } catch (e) {}
        })();

        function toggleTheme() {
            const html = document.documentElement;
            const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            try { localStorage.setItem('bova11-theme', next); } catch (e) {}
        }

        // Preencher lista de datas
        const fileList = document.getElementById('file-list');
        files.forEach((f, i) => {
            const div = document.createElement('div');
            div.className = 'file-item' + (i === 0 ? ' active' : '');
            div.textContent = f;
            div.onclick = () => {
                document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
                div.classList.add('active');
                currentFile = f;
                isFullView = false;
                document.getElementById('btn-toggle').textContent = '👁 Ver Dados Completos';
                showContent();
            };
            fileList.appendChild(div);
        });

        // Exibir conteúdo inicial
        showContent();

        // Botão Copiar
        document.getElementById('btn-copy').onclick = () => {
            navigator.clipboard.writeText(fullText).then(() => {
                const btn = document.getElementById('btn-copy');
                const oldText = btn.textContent;
                btn.textContent = '✓ Copiado!';
                setTimeout(() => { btn.textContent = oldText; }, 2000);
            });
        };

        // Botão Download
        document.getElementById('btn-dl').onclick = () => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([fullText], {type: "text/markdown"}));
            a.download = currentFile + ".md";
            a.click();
        };

        // Botão Toggle
        document.getElementById('btn-toggle').onclick = () => {
            isFullView = !isFullView;
            const btn = document.getElementById('btn-toggle');
            btn.textContent = isFullView ? '👁 Ver Resumo' : '👁 Ver Dados Completos';
            showContent();
        };
    </script>
</body>
</html>
