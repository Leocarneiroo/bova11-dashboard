<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOVA11 - Arquivos (IA)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg: #0d1117; --bg2: #161b22; --border: #30363d; --text: #c9d1d9; --blue: #58a6ff; --green: #238636; }
        [data-theme="light"] { --bg: #f6f8fa; --bg2: #ffffff; --border: #d0d7de; --text: #24292f; --blue: #0969da; --green: #1a7f37; }

        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }

        .shell { display: flex; flex-direction: column; height: 100vh; }
        .hdr { background: var(--bg2); padding: 20px; border-bottom: 1px solid var(--border); }
        .hdr h1 { font-size: 1.5em; margin-bottom: 8px; }
        .hdr p { color: #8b949e; font-size: 0.9em; }
        [data-theme="light"] .hdr p { color: #57606a; }
        .theme-toggle {
            position: fixed;
            top: 12px;
            right: 16px;
            z-index: 9999;
            background: var(--bg2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 0.9rem;
            line-height: 1;
            transition: all 0.2s ease;
        }
        .theme-toggle:hover { border-color: var(--blue); color: var(--blue); }

        .content-wrapper { display: flex; flex: 1; overflow: hidden; gap: 1px; background: var(--border); }

        .sidebar { background: var(--bg2); width: 280px; padding: 16px; overflow-y: auto; border-right: 1px solid var(--border); }
        .sidebar-title { font-weight: bold; font-size: 0.95em; color: var(--text); margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }

        .file-item { padding: 10px 12px; margin-bottom: 6px; border-radius: 6px; cursor: pointer; color: #8b949e; transition: all 0.2s; }
        .file-item:hover { background: var(--bg); color: var(--text); }
        .file-item.active { background: var(--blue); color: black; font-weight: bold; }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }

        .toolbar { padding: 16px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; flex-wrap: wrap; }
        .btn { display: inline-block; padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; font-size: 0.85em; transition: all 0.2s; white-space: nowrap; }
        .btn-primary { background: var(--blue); color: black; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-secondary { background: var(--green); color: white; }
        .btn-secondary:hover { opacity: 0.9; }
        .btn-tertiary { background: var(--bg2); color: var(--text); border: 1px solid var(--border); }
        .btn-tertiary:hover { background: var(--border); }

        .viewer-wrapper { flex: 1; overflow-y: auto; padding: 24px; line-height: 1.6; }
        .viewer-wrapper h1 { font-size: 1.8em; margin-bottom: 12px; color: var(--text); }
        .viewer-wrapper h2 { font-size: 1.3em; margin-top: 24px; margin-bottom: 12px; color: var(--text); border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .viewer-wrapper h3 { font-size: 1.1em; margin-top: 16px; margin-bottom: 8px; color: var(--blue); }
        .viewer-wrapper p { margin-bottom: 12px; color: var(--text); }
        .viewer-wrapper strong { color: var(--text); }
        .viewer-wrapper code { background: var(--bg2); padding: 2px 6px; border-radius: 3px; font-family: Monaco, monospace; font-size: 0.9em; }
        .viewer-wrapper pre { background: var(--bg2); padding: 12px; border-radius: 6px; overflow-x: auto; border: 1px solid var(--border); margin: 12px 0; }
        .viewer-wrapper pre code { background: none; padding: 0; }
        .viewer-wrapper hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
        .viewer-wrapper ul, .viewer-wrapper ol { margin-left: 20px; margin-bottom: 12px; }
        .viewer-wrapper li { margin-bottom: 6px; }

        .status-msg { padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; font-size: 0.9em; }
        .status-info { background: rgba(88, 166, 255, 0.1); color: var(--blue); border: 1px solid var(--blue); }

        @media (max-width: 768px) {
            .content-wrapper { flex-direction: column; }
            .sidebar { width: 100%; max-height: 140px; border-right: none; border-bottom: 1px solid var(--border); }
            .main-content { width: 100%; }

            .toolbar { flex-direction: column; }
            .btn { width: 100%; }

            .viewer-wrapper { padding: 16px; }
            .viewer-wrapper h1 { font-size: 1.3em; }
            .viewer-wrapper h2 { font-size: 1.1em; }

            .hdr { padding: 16px; }
            .hdr h1 { font-size: 1.2em; margin-bottom: 6px; }
            .hdr p { font-size: 0.85em; }

            .sidebar-title { margin-bottom: 10px; padding-bottom: 8px; font-size: 0.9em; }
            .file-item { padding: 8px 10px; margin-bottom: 4px; font-size: 0.9em; }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Alternar tema">◐</button>
    <div class="shell">
        <div class="hdr">
            <h1>📁 Arquivos BOVA11 (IA)</h1>
            <p>Histórico consolidado de análises para uso com assistentes de IA</p>
        </div>

        <div class="content-wrapper">
            <div class="sidebar" id="sidebar">
                <div class="sidebar-title">📅 Datas Disponíveis</div>
                <div id="file-list"></div>
            </div>

            <div class="main-content">
                <div class="toolbar">
                    <button class="btn btn-primary" id="btn-copy">📋 Copiar para IA</button>
                    <button class="btn btn-secondary" id="btn-dl">💾 Download MD</button>
                    <button class="btn btn-tertiary" id="btn-toggle">👁 Ver Dados Completos</button>
                </div>

                <div class="viewer-wrapper">
                    <div id="status-container"></div>
                    <div id="viewer">Carregando...</div>
                </div>
            </div>
        </div>
    </div>

	    <script>
	        const files = ["bova11_2026-04-13", "bova11_2026-04-10", "bova11_2026-04-09", "bova11_2026-04-08", "bova11_2026-04-07", "bova11_2026-04-06", "bova11_2026-04-02", "bova11_2026-04-01", "bova11_2026-03-31", "bova11_2026-03-30", "bova11_2026-03-27"];
	        const embeddedFirstFile = files[0];
	        // Importante: nao embedamos o markdown completo no HTML (pode ficar enorme).
	        // O conteudo completo e carregado via fetch de ../arquivos/<arquivo>.md.
	        const embeddedFullText = `# Arquivos BOVA11 (IA)

Abra este HTML via servidor (GitHub Pages ou http.server) para carregar os .md do historico.
`;
	
	        let currentFile = files[0];
	        let isFullView = false;
	        let fullText = '';
	        let resumoText = `## CONCEITOS E FÓRMULAS VITAIS (Para entendimento da IA)

### 1. Demanda Institucional e PDI (Módulo 17)
- **ADI (Aggregate Demand Index)**: Mede o fluxo total \`0.4*ΔSPS + 0.3*PIC + 0.2*OIF + 0.1*VIC\`.
  * SPS usa puts OTM abaixo de \`spot*0.99\`, calls OTM acima de \`spot*1.01\`, e \`spot_d\` / \`spot_d1\` corretos por dia.
  * PIC/VIC/OIF usam a massa combinada \`D + D-1\` no denominador para manter os ratios na escala interpretável.
  * > +0.02 = Puts demand, Hedging (Bearish/Proteção).
  * < -0.02 = Calls demand, Risk-on (Bullish).
- **PDI (Put Demand Index)**: \`ΔSkew * ΔIV_ATM\`. Avalia a aceleração na demanda por proteção.
  * Hedge: Puts em demanda + IV subindo (medo agudo).
  * Defensive: Puts em demanda mas IV caindo.
- **IDS (Institutional Demand Score)**: Z-score robusto integrado de 7 variáveis (Skew, Premium, OI, IV, GEX, Charm, Vanna), com clipping de extremos, cobertura mínima e renormalização dos pesos ativos quando IV estiver ausente. \`> +0.5 = Bear, < -0.5 = Bull\`.
- **DFP (Delta Flow Proxy)**: Proxy do Delta-adjusted flow em Notional Net.

### 2. Max Pain e Gravitação (Módulos 11 e 12)
- **Max Pain**: Preço de máxima dor para lançadores de opções (onde menor \$ é pago em expiração). O preço tende a ser atraído pra cá perto do vencimento.
- **Mapa Gravitacional (Convergência)**: Distância e alinhamento do Spot com 3 centros de gravidade:
  * μOI = Ponto médio ponderado pelo Open Interest.
  * μGEX = Ponto médio ponderado pelo Gamma Exposure.
  * μDEX = Ponto médio ponderado pelo Delta Exposure.
  * **Score de Convergência (0-100)**: Quanto mais alinhados os três, maior o poder gravitacional. > 75 = Risco centralizado e atração forte.

### 3. Convexidade e Gregos (Módulos 4 e 7 - GEX, Vanna, Charm, TEX, DEX, VEX)
- **GEX (Gamma Exposure)**: Exposição de Gamma líquida dos Dealers. 
  * Fórmula canônica: \`GEX = gamma * OI * spot² / 100\`, calls positivas e puts negativas.
  * GEX Positivo (>0): Dealers vendem na alta, compram na baixa. Comprime a volatilidade e consolida o mercado.
  * GEX Negativo (<0): Dealers compram na alta, vendem na baixa. Aumenta a volatilidade e gera "squeezes".
  * **GEX Flip**: Preço exato onde o GEX muda de sinal (regime de volatilidade inverte).
- **DEX (Delta Exposure)**: \`delta * OI * spot\`, usando \`put_delta\` assinado. Delta agrupado projeta "Walls".
- **VEX (Vega Exposure)**: Exposição de volatilidade a variações de IV.
- **TEX (Theta Exposure)**: Fluxo de dinheiro diário por decaimento de tempo.
- **Vanna**: Mudança de Delta em função da Volatilidade. A decomposição atual usa aproximação Black-Scholes local por \`spot\`, \`strike\`, \`IV\`, \`DTE\` e \`r=0\`.
- **Charm**: Mudança de Delta em função do Tempo. Agora é separado explicitamente do residual; a parte não explicada pelos drivers locais fica em **Residual**.

### 4. Trade Score Institucional (Módulo 5 e 6)
- Avalia cada Opção listada em vários eixos (Liquidez, OI Edge, Vol Edge, GEX Imbalance, Delta/Teta, Distância do Max Pain).
- Gera o **Quality Score (0-100)**. Opções com score alto representam melhores "plays" de mercado, pois têm suporte do Market Maker.
- Institucional Bias analisa o net pressure (comprado em call vs put) nos block trades da B3.

### 5. Prediction e Dinâmica de Skew (Módulos 8, 9, 10, 14, 16)
- **IV Skew Signal v2**: Sinal composto por \`W1*ΔSkew_norm + W2*Z-Score + W3*Aceleração\`, com suavização por MMA.
  * Agregação diária por vencimento usa \`peso = volume_real * fator_DTE\`.
  * DTE curto é filtrado/penalizado para reduzir ruído de pin risk e microestrutura.
  * VOL/OI gera fator de confiança (0.5x a 1.5x) e ajuste direcional (±0.10), diferenciando fluxo real de proteção vs lançamento.
  * Convenção: \`Sinal > 0 = Bearish\` e \`Sinal < 0 = Bullish\`.
- **Hunter Walls**: Agregações severas de volume intradiário. Indica onde "Predadores" agem e travam book.
- **Evolução do GEX History**: O crescimento repentino num strike vira imã de preço.
- **OI Stats**: Distribuição Lognormal das probabililidades.
- **Bandas Reais de Volatilidade**: Modelos GARCH aplicados contra a IV. Se o spot atinge a banda superior do Garch e a IV contrai = Topo.

---`;
	        const cache = {};
	        cache[embeddedFirstFile] = embeddedFullText;
	
	        function extractResumoFromMarkdown(md) {
	            // Mirror python extrair_resumo(): capture from "## CONCEITOS..." until "## EXTRATO DE DADOS"
	            const lines = String(md || '').split('\n');
	            const out = [];
	            let inConcepts = false;
	            for (const line of lines) {
	                if (line.includes('## CONCEITOS E FÓRMULAS VITAIS')) inConcepts = true;
	                if (inConcepts && line.startsWith('## EXTRATO DE DADOS')) break;
	                if (inConcepts) out.push(line);
	            }
	            return out.length ? out.join('\n') : 'Resumo não disponível';
	        }

        // Renderizar markdown para HTML
        function render(text) {
            let html = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
            html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
            html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
            html = html.replace(/```([a-z]*)\n([\s\S]*?)```/g, '<pre><code class="lang-$1">$2</code></pre>');
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            html = html.replace(/^---$/gim, '<hr>');
            html = html.replace(/^- (.*$)/gim, '<li>$1</li>');
            html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
            document.getElementById('viewer').innerHTML = html;
        }

        function updateStatus() {
            const statusDiv = document.getElementById('status-container');
            const viewMode = isFullView ? 'Dados Completos' : 'Resumo (Conceitos)';
            statusDiv.innerHTML = `<div class="status-msg status-info">📄 ${currentFile} — ${viewMode}</div>`;
        }

	        function showContent() {
	            const content = isFullView ? fullText : resumoText;
	            render(content);
	            updateStatus();
	        }
	
	        async function loadMarkdown(name) {
	            if (cache[name]) return cache[name];
	            // Prefer dynamic loading so all dates work without embedding massive payloads in the HTML.
	            try {
	                const url = `../arquivos/${encodeURIComponent(name)}.md?ts=${Date.now()}`;
	                const res = await fetch(url, { cache: 'no-store' });
	                if (!res.ok) throw new Error(`HTTP ${res.status}`);
	                const txt = await res.text();
	                cache[name] = txt;
	                return txt;
	            } catch (e) {
	                // Offline/file:// open often blocks fetch. Keep embedded content as fallback.
	                if (name === embeddedFirstFile) return embeddedFullText;
	                throw e;
	            }
	        }
	
	        async function selectFile(name) {
	            currentFile = name;
	            isFullView = false;
	            document.getElementById('btn-toggle').textContent = '👁 Ver Dados Completos';
	
	            try {
	                const txt = await loadMarkdown(name);
	                fullText = txt;
	                resumoText = extractResumoFromMarkdown(txt);
	                showContent();
	            } catch (e) {
	                const statusDiv = document.getElementById('status-container');
	                statusDiv.innerHTML =
	                    `<div class="status-msg status-info">⚠️ Não foi possível carregar <strong>${name}</strong>. Para usar múltiplas datas, abra via GitHub Pages ou sirva a pasta localmente (ex.: <code>python3 -m http.server</code>).</div>`;
	                // Keep previous content visible.
	                updateStatus();
	            }
	        }

        (function() {
            try {
                const saved = localStorage.getItem('bova11-theme');
                if (saved === 'light' || saved === 'dark') {
                    document.documentElement.setAttribute('data-theme', saved);
                }
            } catch (e) {}
        })();

        function toggleTheme() {
            const html = document.documentElement;
            const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            try { localStorage.setItem('bova11-theme', next); } catch (e) {}
        }

        // Preencher lista de datas
        const fileList = document.getElementById('file-list');
	        files.forEach((f, i) => {
	            const div = document.createElement('div');
	            div.className = 'file-item' + (i === 0 ? ' active' : '');
	            div.textContent = f;
	            div.onclick = () => {
	                document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
	                div.classList.add('active');
	                selectFile(f);
	            };
	            fileList.appendChild(div);
	        });

	        // Exibir conteúdo inicial
	        selectFile(files[0]);

        // Botão Copiar
        document.getElementById('btn-copy').onclick = () => {
            navigator.clipboard.writeText(fullText).then(() => {
                const btn = document.getElementById('btn-copy');
                const oldText = btn.textContent;
                btn.textContent = '✓ Copiado!';
                setTimeout(() => { btn.textContent = oldText; }, 2000);
            });
        };

        // Botão Download
        document.getElementById('btn-dl').onclick = () => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([fullText], {type: "text/markdown"}));
            a.download = currentFile + ".md";
            a.click();
        };

        // Botão Toggle
        document.getElementById('btn-toggle').onclick = () => {
            isFullView = !isFullView;
            const btn = document.getElementById('btn-toggle');
            btn.textContent = isFullView ? '👁 Ver Resumo' : '👁 Ver Dados Completos';
            showContent();
        };
    </script>
</body>
</html>
