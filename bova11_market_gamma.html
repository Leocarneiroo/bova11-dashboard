<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Market Gamma</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="shared.js"></script>
  <style>
    :root {
      --bg:#f4f6fb; --surface:#ffffff; --surface2:#eef2fa; --text:#111827; --muted:#5b6577;
      --line:#d4ddeb; --blue:#2563eb; --green:#15803d; --red:#b91c1c; --gold:#b45309;
      --font:'Instrument Sans',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
    }
    [data-theme="dark"] {
      --bg:#0f172a; --surface:#111c31; --surface2:#1a2a45; --text:#e7edf7; --muted:#9fb0c8;
      --line:#314a70; --blue:#2f81f7; --green:#22c55e; --red:#ef4444; --gold:#facc15;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:var(--font);padding:20px}
    #theme-toggle{position:fixed;top:12px;right:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:8px 10px;border-radius:10px;cursor:pointer}
    .page{max-width:1360px;margin:0 auto}
    h1{text-align:center;font-size:3rem;letter-spacing:-.04em;margin:10px 0 14px}
    .bar{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:14px}
    .sel{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:10px 12px;border-radius:10px;font-weight:600}
    .chart-wrap{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
    canvas{max-height:480px}
    .cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:14px}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
    .card .k{font:.72rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
    .card .v{margin-top:6px;font:700 1.4rem var(--mono)}
    @media(max-width:1100px){.cards{grid-template-columns:1fr 1fr}}
    @media(max-width:680px){h1{font-size:2.2rem}.cards{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <button id="theme-toggle" onclick="toggleTheme()">Tema</button>
  <div class="page">
    <h1>Market Gamma</h1>
    <div class="bar">
      <select id="mode" class="sel"></select>
      <div id="meta" class="sel"></div>
    </div>
    <div class="chart-wrap">
      <canvas id="gamma"></canvas>
    </div>
    <div class="cards">
      <div class="card"><div class="k">Gamma Score [σ]</div><div class="v" id="c-score">-</div></div>
      <div class="card"><div class="k">Gamma Atual</div><div class="v" id="c-atual">-</div></div>
      <div class="card"><div class="k">Gamma Mínimo Negativo</div><div class="v" id="c-min">-</div></div>
      <div class="card"><div class="k">Flip</div><div class="v" id="c-flip">-</div></div>
      <div class="card"><div class="k">Gamma Máximo Positivo</div><div class="v" id="c-max">-</div></div>
    </div>
  </div>

<script>
const DATA = {"asset": "BOVA11", "ref_date": "2026-10-06", "ref_display": "06/10/2026", "curves": {"AGREGADO": {"strikes": [193.0, 194.0, 195.0, 196.0, 197.0, 198.0, 199.0, 200.0, 204.0, 205.0, 209.0, 210.0, 214.0, 215.0, 219.0, 220.0], "call": [0.0, 17233539.633562498, 46897160.7178125, 17685076.264875, 36320606.832993746, 13996014.593625002, 56865265.136325, 134768643.969375, 23968376.199, 111485537.15624999, 16898010.503625, 253567477.6875, 14949238.5, 158691801.756375, 14247697.4240625, 85962222.0], "put": [-15172.3125, -8910910.313437501, -21413406.792318746, -11834583.357375, -11645402.663250001, -7322216.6514375005, -22262254.6611375, -61296850.267875, -9986674.426875, -42911810.4375, -4093043.3544375002, -14554476.662062502, -313853.63625, -25204491.931556247, -19176.5728125, -24241320.36], "net": [-15172.3125, 8322629.320124999, 25483753.92549375, 5850492.907499998, 24675204.169743747, 6673797.942187499, 34603010.475187495, 73471793.7015, 13981701.772125002, 68573726.71874999, 12804967.1491875, 239013001.0254375, 14635384.86375, 133487309.82481875, 14228520.85125, 61720901.64], "spot": 202.5, "flip": 193.0, "gamma_atual": 13981701.772125002, "gamma_min_neg": {"strike": 193.0, "value": -15172.3125}, "gamma_max_pos": {"strike": 210.0, "value": 239013001.0254375}, "gamma_score": 0.05849766210264423}, "16 out Mensal": {"strikes": [194.0, 195.0, 196.0, 197.0, 199.0, 200.0, 205.0, 210.0, 215.0, 220.0], "call": [10405746.0, 38940355.125, 8033613.989624999, 26310840.187499996, 37225473.75, 110590575.75, 90458147.24999999, 239074638.75, 130178441.25, 41937912.0], "put": [-6012720.193500001, -11780275.5, -8241568.575187501, -7781336.568562501, -8887128.738750001, -44728387.3125, -19983165.749999996, -8979228.776250001, -1701341.1112499998, -1146600.36], "net": [4393025.806499999, 27160079.625, -207954.5855625011, 18529503.618937496, 28338345.011249997, 65862188.4375, 70474981.49999999, 230095409.97375, 128477100.13875, 40791311.64], "spot": 202.5, "flip": 195.99, "gamma_atual": 65862188.4375, "gamma_min_neg": {"strike": 196.0, "value": -207954.5855625011}, "gamma_max_pos": {"strike": 210.0, "value": 230095409.97375}, "gamma_score": 0.2862386018261458}, "19 nov Mensal": {"strikes": [195.0, 196.0, 197.0, 198.0, 199.0, 200.0, 205.0, 210.0, 215.0, 220.0], "call": [4164479.5224375, 2019254.3662500002, 2556497.7506250003, 2751723.1760624996, 2479369.0949999997, 24136278.749999996, 20770485.75, 14492838.9375, 28393547.625, 44024310.0], "put": [-4768563.0943125, -1630816.5121875003, -2697592.0556250005, -3762558.8133750004, -5175102.3373125, -10776442.499999998, -15267857.0625, -5575247.8858125005, -23503142.25, -23094720.0], "net": [-604083.5718750004, 388437.85406249994, -141094.30500000017, -1010835.6373125007, -2695733.2423125003, 13359836.249999998, 5502628.6875, 8917591.0516875, 4890405.375, 20929590.0], "spot": 202.5, "flip": 195.61, "gamma_atual": 13359836.249999998, "gamma_min_neg": {"strike": 199.0, "value": -2695733.2423125003}, "gamma_max_pos": {"strike": 220.0, "value": 20929590.0}, "gamma_score": 0.6383228840125391}, "23 out W4": {"strikes": [194.0, 195.0, 196.0, 197.0, 198.0, 199.0, 204.0, 209.0, 219.0], "call": [273535.471125, 19145.818124999998, 1984702.5, 694163.2314375, 32030.3919375, 120794.9810625, 889238.5739999999, 621399.691125, 5380505.9240625], "put": [-791241.8377500001, -2071615.246875, -178623.22499999998, -116506.54743749999, -1732337.3255625002, -3485051.8869375, -4149378.15075, -1304585.9594999999, -354.7040625], "net": [-517706.3666250001, -2052469.42875, 1806079.275, 577656.684, -1700306.933625, -3364256.905875, -3260139.57675, -683186.2683749999, 5380151.22], "spot": 202.5, "flip": 195.53, "gamma_atual": -3260139.57675, "gamma_min_neg": {"strike": 199.0, "value": -3364256.905875}, "gamma_max_pos": {"strike": 219.0, "value": 5380151.22}, "gamma_score": -0.6059568669056853}, "30 out W5": {"strikes": [193.0, 195.0, 197.0, 198.0, 199.0, 200.0, 205.0, 215.0], "call": [0.0, 1664.8537499999998, 8.98036875, 18071.454375, 1912.20345, 41789.469375, 256904.15625, 119812.88137499998], "put": [-15172.3125, -58.269881250000005, -267614.98875, 0.0, -960.85845, -5792020.455375, -7660787.625, -8.57030625], "net": [-15172.3125, 1606.5838687499997, -267606.00838125, 18071.454375, 951.345, -5750230.986, -7403883.46875, 119804.31106874999], "spot": 202.5, "flip": 194.81, "gamma_atual": -5750230.986, "gamma_min_neg": {"strike": 205.0, "value": -7403883.46875}, "gamma_max_pos": {"strike": 215.0, "value": 119804.31106874999}, "gamma_score": -0.7766506604635706}, "9 out W2": {"strikes": [194.0, 195.0, 196.0, 197.0, 198.0, 199.0, 204.0, 209.0, 214.0, 219.0], "call": [6554258.1624374995, 3771515.3984999997, 5647505.408999999, 6759096.6830625, 11194189.571250001, 17037715.1068125, 23079137.625, 16276610.8125, 14949238.5, 8867191.5], "put": [-2106948.2821875, -2792894.68125, -1783575.0449999997, -782352.5028750001, -1827320.5125000002, -4714010.839687499, -5837296.276125001, -2788457.3949375004, -313853.63625, -18821.868749999998], "net": [4447309.880249999, 978620.7172499998, 3863930.363999999, 5976744.1801875, 9366869.05875, 12323704.267125, 17241841.348875, 13488153.4175625, 14635384.86375, 8848369.63125], "spot": 202.5, "flip": null, "gamma_atual": 17241841.348875, "gamma_min_neg": null, "gamma_max_pos": {"strike": 204.0, "value": 17241841.348875}, "gamma_score": 1.0}}};
let chart = null;

function fmtNum(v){
  if (v === null || v === undefined) return '-';
  const a = Math.abs(v);
  if (a >= 1e9) return (v/1e9).toFixed(2)+'B';
  if (a >= 1e6) return (v/1e6).toFixed(1)+'M';
  if (a >= 1e3) return (v/1e3).toFixed(1)+'k';
  return v.toFixed(0);
}

function draw(mode){
  const c = DATA.curves[mode];
  if (!c) return;
  document.getElementById('meta').textContent = `${DATA.asset} · ${DATA.ref_display} · Spot R$ ${c.spot.toFixed(2)}`;

  document.getElementById('c-score').textContent = c.gamma_score.toFixed(2);
  document.getElementById('c-atual').textContent = fmtNum(c.gamma_atual);
  document.getElementById('c-min').textContent = c.gamma_min_neg ? `R$ ${c.gamma_min_neg.strike.toFixed(2)} · ${fmtNum(c.gamma_min_neg.value)}` : '-';
  document.getElementById('c-flip').textContent = c.flip ? `R$ ${c.flip.toFixed(2)}` : '-';
  document.getElementById('c-max').textContent = c.gamma_max_pos ? `R$ ${c.gamma_max_pos.strike.toFixed(2)} · ${fmtNum(c.gamma_max_pos.value)}` : '-';

  const pos = c.net.map(v => v > 0 ? v : null);
  const neg = c.net.map(v => v < 0 ? v : null);

  const spotIdx = c.strikes.length ? c.strikes.reduce((best, s, i) => Math.abs(s-c.spot) < Math.abs(c.strikes[best]-c.spot) ? i : best, 0) : 0;
  const flipIdx = (c.flip && c.strikes.length) ? c.strikes.reduce((best, s, i) => Math.abs(s-c.flip) < Math.abs(c.strikes[best]-c.flip) ? i : best, 0) : null;

  const vlinePlugin = {
    id: 'vline',
    afterDatasetsDraw(ch){
      const {ctx, chartArea:{top,bottom}, scales:{x}} = ch;
      ctx.save();
      if (c.strikes.length) {
        const xSpot = x.getPixelForValue(spotIdx);
        ctx.strokeStyle = '#2f81f7'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(xSpot, top); ctx.lineTo(xSpot, bottom); ctx.stroke();
      }
      if (flipIdx !== null) {
        const xFlip = x.getPixelForValue(flipIdx);
        ctx.strokeStyle = '#facc15'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(xFlip, top); ctx.lineTo(xFlip, bottom); ctx.stroke();
      }
      ctx.restore();
    }
  };

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('gamma'), {
    type: 'line',
    data: {
      labels: c.strikes.map(s => s.toFixed(2)),
      datasets: [
        {label:'Positivo', data:pos, borderColor:'#22c55e', backgroundColor:'rgba(34,197,94,.25)', fill:true, pointRadius:0, tension:.25},
        {label:'Negativo', data:neg, borderColor:'#ef4444', backgroundColor:'rgba(239,68,68,.25)', fill:true, pointRadius:0, tension:.25},
        {label:'Net Gamma', data:c.net, borderColor:'#facc15', pointRadius:0, tension:.25, fill:false},
      ]
    },
    options: {
      responsive:true,
      maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{labels:{color:getComputedStyle(document.documentElement).getPropertyValue('--text')}}},
      scales:{
        x:{ticks:{color:getComputedStyle(document.documentElement).getPropertyValue('--muted')}},
        y:{ticks:{color:getComputedStyle(document.documentElement).getPropertyValue('--muted')}}
      }
    },
    plugins:[vlinePlugin]
  });
}

const sel = document.getElementById('mode');
Object.keys(DATA.curves).forEach((k, i) => {
  const o = document.createElement('option');
  o.value = k;
  o.textContent = i === 0 ? 'Visão Completa (Agregado)' : k;
  sel.appendChild(o);
});
sel.value = 'AGREGADO';
sel.addEventListener('change', () => draw(sel.value));
draw('AGREGADO');
</script>
</body>
</html>
