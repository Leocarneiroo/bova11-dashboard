<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOVA11 — Flow History</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 5px;
            color: #58a6ff;
        }

        .subtitle {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 30px;
        }

        .controls {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .control-group {
            margin-bottom: 25px;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        .control-label {
            font-size: 13px;
            font-weight: 600;
            color: #c9d1d9;
            margin-bottom: 12px;
            display: block;
        }

        .pill-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .pill {
            padding: 6px 12px;
            border: 1px solid #30363d;
            border-radius: 16px;
            background: #0d1117;
            color: #c9d1d9;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .pill:hover {
            border-color: #58a6ff;
            background: #161b22;
        }

        .pill.active {
            background: #58a6ff;
            color: #0d1117;
            border-color: #58a6ff;
        }

        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .cal-header {
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            color: #8b949e;
            padding: 8px 0;
        }

        .cal-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #30363d;
            border-radius: 4px;
            background: #0d1117;
            color: #c9d1d9;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .cal-day:hover {
            border-color: #58a6ff;
            background: #161b22;
        }

        .cal-day.selected {
            background: #58a6ff;
            color: #0d1117;
            border-color: #58a6ff;
        }

        .cal-day.empty {
            background: transparent;
            border: none;
            cursor: default;
        }

        .cal-day.empty:hover {
            background: transparent;
            border: none;
        }

        .cal-buttons {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .cal-btn {
            padding: 6px 12px;
            border: 1px solid #30363d;
            border-radius: 4px;
            background: #0d1117;
            color: #8b949e;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }

        .cal-btn:hover {
            border-color: #58a6ff;
            color: #58a6ff;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #c9d1d9;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #30363d;
        }

        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .grid-1row-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .table-wrapper {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            overflow: hidden;
        }

        .table-title {
            font-size: 12px;
            font-weight: 600;
            color: #c9d1d9;
            background: #161b22;
            padding: 10px 12px;
            border-bottom: 1px solid #30363d;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 8px 12px;
            text-align: left;
            font-weight: 600;
            color: #8b949e;
        }

        td {
            padding: 8px 12px;
            border-bottom: 1px solid #30363d;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .strike-cell {
            font-weight: 600;
            color: #58a6ff;
        }

        .number-cell {
            text-align: right;
            font-family: 'Monaco', 'Courier New', monospace;
        }

        .entry {
            color: #3fb950;
        }

        .exit {
            color: #f85149;
        }

        .bar {
            height: 10px;
            border-radius: 2px;
            display: inline-block;
        }

        .bar-entry {
            background: #3fb950;
        }

        .bar-exit {
            background: #f85149;
        }

        .error {
            background: #161b22;
            border: 1px solid #f85149;
            border-radius: 6px;
            padding: 15px;
            color: #f85149;
            margin: 20px 0;
        }

        @media (max-width: 1200px) {
            .grid-2col {
                grid-template-columns: 1fr;
            }
            .grid-1row-2col {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

        const ALL_DATES = ["10/mar", "11/mar", "12/mar", "13/mar", "16/mar", "3/mar", "4/mar", "5/mar", "6/mar", "9/mar"];
        const ALL_EXPIRIES = ["17 abr Mensal", "10 abr W2", "2 abr W1", "27 mar W4", "20 mar Mensal", "13 mar W2", "6 mar W1"];

        let selectedDates = new Set(ALL_DATES);
        let selectedExpiries = new Set(ALL_EXPIRIES);

        // ─── INITIALIZATION ───

        function init() {
            renderExpiryPills();
            renderCalendar();
            renderAll();
        }

        function renderExpiryPills() {
            const container = document.getElementById('expiry-pills');
            container.innerHTML = '';

            const allPill = document.createElement('div');
            allPill.className = 'pill active';
            allPill.textContent = 'Todas';
            allPill.onclick = () => {
                if (selectedExpiries.size === ALL_EXPIRIES.length) {
                    selectedExpiries = new Set();
                } else {
                    selectedExpiries = new Set(ALL_EXPIRIES);
                }
                renderExpiryPills();
                renderAll();
            };
            container.appendChild(allPill);

            for (const exp of ALL_EXPIRIES) {
                const p = document.createElement('div');
                p.className = 'pill' + (selectedExpiries.has(exp) ? ' active' : '');
                p.textContent = exp;
                p.onclick = () => {
                    if (selectedExpiries.has(exp)) {
                        selectedExpiries.delete(exp);
                    } else {
                        selectedExpiries.add(exp);
                    }
                    renderExpiryPills();
                    renderAll();
                };
                container.appendChild(p);
            }
        }

        function renderCalendar() {
            const container = document.getElementById('calendar-container');
            container.innerHTML = '';

            // Group dates by month
            const datesByMonth = {};
            for (const date of ALL_DATES) {
                const [day, month] = date.split('/');
                if (!datesByMonth[month]) datesByMonth[month] = [];
                datesByMonth[month].push({day: parseInt(day), full: date});
            }

            // Sort months and days
            const months_order = ['mar', 'abr', 'mai', 'jun', 'fev', 'jan', 'dez', 'nov', 'out', 'set', 'ago', 'jul'];
            const sortedMonths = Object.keys(datesByMonth).sort((a, b) => {
                return months_order.indexOf(a) - months_order.indexOf(b);
            });

            for (const month of sortedMonths) {
                const monthDates = datesByMonth[month].sort((a, b) => b.day - a.day);

                const monthTitle = document.createElement('div');
                monthTitle.style.fontSize = '13px';
                monthTitle.style.fontWeight = '600';
                monthTitle.style.marginTop = '15px';
                monthTitle.style.marginBottom = '8px';
                monthTitle.style.textTransform = 'uppercase';
                monthTitle.textContent = month;
                container.appendChild(monthTitle);

                const cal = document.createElement('div');
                cal.className = 'calendar';

                // Add day headers
                const headers = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
                for (const h of headers) {
                    const hEl = document.createElement('div');
                    hEl.className = 'cal-header';
                    hEl.textContent = h;
                    cal.appendChild(hEl);
                }

                // Add days
                for (const dateObj of monthDates) {
                    const day = document.createElement('div');
                    day.className = 'cal-day' + (selectedDates.has(dateObj.full) ? ' selected' : '');
                    day.textContent = dateObj.day;
                    day.onclick = () => {
                        if (selectedDates.has(dateObj.full)) {
                            selectedDates.delete(dateObj.full);
                        } else {
                            selectedDates.add(dateObj.full);
                        }
                        renderCalendar();
                        renderAll();
                    };
                    cal.appendChild(day);
                }

                container.appendChild(cal);
            }
        }

        function selectAllDates() {
            if (selectedDates.size === ALL_DATES.length) {
                selectedDates = new Set();
            } else {
                selectedDates = new Set(ALL_DATES);
            }
            renderCalendar();
            renderAll();
        }

        // ─── DATA FILTERING ───

        function getFilteredData() {
            const result = {};

            for (const date of selectedDates) {
                if (!DATA[date]) continue;
                for (const exp of selectedExpiries) {
                    if (!DATA[date][exp]) continue;

                    for (const strike_str in DATA[date][exp]) {
                        const entry = DATA[date][exp][strike_str];
                        if (entry.snap) continue;

                        if (!result[strike_str]) {
                            result[strike_str] = {dco_sum: 0, dpo_sum: 0, cv_sum: 0, pv_sum: 0};
                        }
                        result[strike_str].dco_sum += entry.dco || 0;
                        result[strike_str].dpo_sum += entry.dpo || 0;
                        result[strike_str].cv_sum += entry.cv || 0;
                        result[strike_str].pv_sum += entry.pv || 0;
                    }
                }
            }

            return result;
        }

        function getTopN(strikeMap, field, direction) {
            const entries = Object.entries(strikeMap)
                .map(([strike, data]) => ({strike: parseInt(strike), value: data[field]}))
                .filter(e => direction === 'entry' ? e.value > 0 : e.value < 0);

            if (direction === 'entry') {
                entries.sort((a, b) => b.value - a.value);
            } else {
                entries.sort((a, b) => a.value - b.value);
            }

            return entries;  // Retorna TODOS os dados, sem limite
        }

        // ─── RENDERING ───

        function renderCumulativeRanking() {
            const filtered = getFilteredData();
            if (Object.keys(filtered).length === 0) {
                document.getElementById('cumulative-content').innerHTML = '<div class="error">Nenhum dado para o período selecionado</div>';
                return;
            }

            const callEntries = getTopN(filtered, 'dco_sum', 'entry');
            const callExits = getTopN(filtered, 'dco_sum', 'exit');
            const putEntries = getTopN(filtered, 'dpo_sum', 'entry');
            const putExits = getTopN(filtered, 'dpo_sum', 'exit');

            const callMaxEntry = Math.max(...callEntries.map(e => e.value), 1);
            const callMaxExit = Math.max(...callExits.map(e => Math.abs(e.value)), 1);
            const putMaxEntry = Math.max(...putEntries.map(e => e.value), 1);
            const putMaxExit = Math.max(...putExits.map(e => Math.abs(e.value)), 1);

            let html = '<div class="grid-1row-2col">';

            html += '<div>';
            html += renderTable('Calls — Entradas Acumuladas', callEntries, 'entry', callMaxEntry);
            html += '</div>';

            html += '<div>';
            html += renderTable('Puts — Entradas Acumuladas', putEntries, 'entry', putMaxEntry);
            html += '</div>';

            html += '</div>';

            html += '<div class="grid-1row-2col" style="margin-top: 20px;">';

            html += '<div>';
            html += renderTable('Calls — Saídas Acumuladas', callExits, 'exit', callMaxExit);
            html += '</div>';

            html += '<div>';
            html += renderTable('Puts — Saídas Acumuladas', putExits, 'exit', putMaxExit);
            html += '</div>';

            html += '</div>';

            document.getElementById('cumulative-content').innerHTML = html;
        }

        function renderTable(title, entries, type, maxValue) {
            if (entries.length === 0) {
                return '<div class="table-wrapper"><div class="table-title">' + title + ' (vazio)</div></div>';
            }

            let html = '<div class="table-wrapper">';
            html += '<div class="table-title">' + title + ' — ' + entries.length + ' strikes</div>';
            html += '<table>';
            html += '<tr><th>Strike</th><th>OI Δ</th><th>Volume</th><th>Gráfico</th></tr>';

            for (const entry of entries) {
                const strike = entry.strike;
                const value = entry.value;
                const barWidth = Math.min(200, Math.abs(value) / maxValue * 200);
                const color = type === 'entry' ? '#3fb950' : '#f85149';
                const formattedValue = value > 0 ? '+' + value.toLocaleString('pt-BR') : value.toLocaleString('pt-BR');

                html += '<tr>';
                html += '<td class="strike-cell">' + strike + '</td>';
                html += '<td class="number-cell ' + (type === 'entry' ? 'entry' : 'exit') + '">' + formattedValue + '</td>';
                html += '<td class="number-cell">-</td>';
                html += '<td><div class="bar bar-' + type + '" style="width:' + barWidth + 'px;"></div></td>';
                html += '</tr>';
            }

            html += '</table>';
            html += '</div>';
            return html;
        }

        function renderAll() {
            renderCumulativeRanking();
        }

        // Initialize on load
        init();
    </script>
