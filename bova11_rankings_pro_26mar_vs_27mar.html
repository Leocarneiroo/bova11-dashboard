}
function renderViewSel(){
  const el=document.getElementById('viewSel');
  if(cur==='AGG'){el.innerHTML='';return}
  const vs=[{id:'rank',l:'📊 Rankings'},{id:'table',l:'📋 Tabela'},{id:'greeks',l:'🔬 Gregas'}];
  el.innerHTML=vs.map(v=>`<div class="vbtn ${view===v.id?'on':''}" data-v="${v.id}">${v.l}</div>`).join('');
  el.querySelectorAll('.vbtn').forEach(b=>b.onclick=()=>{view=b.dataset.v;renderAll()});
}
function showViews(){
  ['vRank','vTable','vGreeks','vAgg'].forEach(id=>document.getElementById(id).style.display='none');
  if(cur==='AGG')document.getElementById('vAgg').style.display='block';
  else document.getElementById({rank:'vRank',table:'vTable',greeks:'vGreeks'}[view]).style.display='block';
}

      <div class="kpi"><div class="l">ΔOI Total</div><div class="v ${pc(s('dcoi')+s('dpoi'))}">${sg(s('dcoi')+s('dpoi'))}${fI(s('dcoi')+s('dpoi'))}</div></div>

    <div class="kpi"><div class="l">IV Put ATM</div><div class="v" style="color:var(--org)">${e.iv_p_atm}%</div><div class="d ${pc(e.div_p_atm)}">${sg(e.div_p_atm)}${e.div_p_atm.toFixed(2)}pp</div></div>
    <div class="kpi"><div class="l">PCR OI</div><div class="v">${e.pcr_oi}</div><div class="d ${pc(e.dpcr_oi)}">Δ${sg(e.dpcr_oi)}${e.dpcr_oi.toFixed(2)}</div></div>
    <div class="kpi"><div class="l">PCR Vol</div><div class="v">${e.pcr_vol}</div><div class="d ${pc(e.dpcr_vol)}">Δ${sg(e.dpcr_vol)}${e.dpcr_vol.toFixed(2)}</div></div>
    <div class="kpi"><div class="l">OI C/P</div><div class="v">${fI(e.coi)}/${fI(e.poi)}</div><div class="d">Δ:${sg(e.dcoi)}${fI(e.dcoi)}/${sg(e.dpoi)}${fI(e.dpoi)}</div></div>
    <div class="kpi"><div class="l">Vol Total</div><div class="v">${fI(e.cvol+e.pvol)}</div><div class="d ${pc(e.d_tvol)}">Δ${sg(e.d_tvol)}${fI(e.d_tvol)}</div></div>
    <div class="kpi"><div class="l">ΔVol C/P</div><div class="v"><span class="${pc(e.d_cvol)}">${sg(e.d_cvol)}${fI(e.d_cvol)}</span>/<span class="${pc(e.d_pvol)}">${sg(e.d_pvol)}${fI(e.d_pvol)}</span></div></div>`;
}

function mkRank(title,st,sortFn,cols){
  const rows=[...st].sort(sortFn).slice(0,10);
  let h=`<div class="card"><h3>${title}</h3><div style="max-height:300px;overflow:auto"><table><thead><tr>`;
  cols.forEach(c=>{h+=`<th>${c.h}</th>`});
  h+=`</tr></thead><tbody>`;
  rows.forEach(r=>{h+=`<tr>`;cols.forEach(c=>{const v=c.fmt?c.fmt(r):(r[c.k]??'–');h+=`<td class="${c.cls?c.cls(r):''}">${v}</td>`});h+=`</tr>`});
  return h+`</tbody></table></div></div>`}

function renderRankings(){
  if(cur==='AGG')return;
  const st=D[cur].strikes;
  let h='<div class="stitle">Rankings por Strike (Top 10)</div><div class="g4">';
  h+=mkRank('🔥 Vol Total D',st,(a,b)=>b.tv-a.tv,[{h:'K',k:'s'},{h:'VolC',fmt:r=>fI(r.cv)},{h:'VolP',fmt:r=>fI(r.pv)},{h:'Total',fmt:r=>'<b>'+fI(r.tv)+'</b>'}]);
  h+=mkRank('📈 ΔVol Total',st,(a,b)=>b.dtv-a.dtv,[{h:'K',k:'s'},{h:'ΔVC',fmt:r=>sg(r.dcv)+fI(r.dcv),cls:r=>pc(r.dcv)},{h:'ΔVP',fmt:r=>sg(r.dpv)+fI(r.dpv),cls:r=>pc(r.dpv)},{h:'ΔT',fmt:r=>'<b>'+sg(r.dtv)+fI(r.dtv)+'</b>',cls:r=>pc(r.dtv)}]);
  h+=mkRank('📊 ΔOI Call (abs)',st,(a,b)=>Math.abs(b.dco)-Math.abs(a.dco),[{h:'K',k:'s'},{h:'OI D-1',fmt:r=>fI(r.co1)},{h:'OI D',fmt:r=>fI(r.co2)},{h:'Δ',fmt:r=>'<b>'+sg(r.dco)+fI(r.dco)+'</b>',cls:r=>pc(r.dco)}]);
  h+=mkRank('📊 ΔOI Put (abs)',st,(a,b)=>Math.abs(b.dpo)-Math.abs(a.dpo),[{h:'K',k:'s'},{h:'OI D-1',fmt:r=>fI(r.po1)},{h:'OI D',fmt:r=>fI(r.po2)},{h:'Δ',fmt:r=>'<b>'+sg(r.dpo)+fI(r.dpo)+'</b>',cls:r=>pc(r.dpo)}]);
  h+=mkRank('🌡️ ΔIV Call (abs)',st,(a,b)=>Math.abs(b.c_ivd||0)-Math.abs(a.c_ivd||0),[{h:'K',k:'s'},{h:'D-1',fmt:r=>r.c_iv1!=null?r.c_iv1.toFixed(1)+'%':'–'},{h:'D',fmt:r=>r.c_iv2!=null?r.c_iv2.toFixed(1)+'%':'–'},{h:'ΔIV',fmt:r=>r.c_ivd!=null?sg(r.c_ivd)+r.c_ivd.toFixed(2)+'pp':'–',cls:r=>pc(r.c_ivd)}]);
  h+=mkRank('🌡️ ΔIV Put (abs)',st,(a,b)=>Math.abs(b.p_ivd||0)-Math.abs(a.p_ivd||0),[{h:'K',k:'s'},{h:'D-1',fmt:r=>r.p_iv1!=null?r.p_iv1.toFixed(1)+'%':'–'},{h:'D',fmt:r=>r.p_iv2!=null?r.p_iv2.toFixed(1)+'%':'–'},{h:'ΔIV',fmt:r=>r.p_ivd!=null?sg(r.p_ivd)+r.p_ivd.toFixed(2)+'pp':'–',cls:r=>pc(r.p_ivd)}]);
  h+=mkRank('💰 ΔPreço Call %',st,(a,b)=>Math.abs(b.cp_pct)-Math.abs(a.cp_pct),[{h:'K',k:'s'},{h:'D-1',fmt:r=>r.c_last1.toFixed(2)},{h:'D',fmt:r=>r.c_last2.toFixed(2)},{h:'Δ%',fmt:r=>sg(r.cp_pct)+r.cp_pct.toFixed(1)+'%',cls:r=>pc(r.cp_pct)}]);
  h+=mkRank('💰 ΔPreço Put %',st,(a,b)=>Math.abs(b.pp_pct)-Math.abs(a.pp_pct),[{h:'K',k:'s'},{h:'D-1',fmt:r=>r.p_last1.toFixed(2)},{h:'D',fmt:r=>r.p_last2.toFixed(2)},{h:'Δ%',fmt:r=>sg(r.pp_pct)+r.pp_pct.toFixed(1)+'%',cls:r=>pc(r.pp_pct)}]);
  h+='</div>';
  document.getElementById('vRank').innerHTML=h;
}

    '<th>K</th><th>C D-1</th><th>C D</th><th>Δ%</th><th>P D-1</th><th>P D</th><th>Δ%</th>'+

      <td>${fI(r.cv1)}</td><td>${fI(r.cv)}</td><td class="${pc(r.dcv)}">${sg(r.dcv)}${fI(r.dcv)}</td>
      <td>${fI(r.pv1)}</td><td>${fI(r.pv)}</td><td class="${pc(r.dpv)}">${sg(r.dpv)}${fI(r.dpv)}</td>

      <td class="${pc(r.c_ivd)}">${r.c_ivd!=null?sg(r.c_ivd)+r.c_ivd.toFixed(2)+'pp':'–'}</td>

      <td class="${pc(r.p_ivd)}">${r.p_ivd!=null?sg(r.p_ivd)+r.p_ivd.toFixed(2)+'pp':'–'}</td></tr>`});
  h+='</tbody></table></div></div>';
  document.getElementById('vTable').innerHTML=h;
}

function renderGreeks(){
  if(cur==='AGG')return;
  const st=D[cur].strikes;
  function mkG(title,fields){
    const rows=[...st].sort((a,b)=>a.s-b.s);
    let h=`<div class="card"><h3>${title}</h3><div style="max-height:380px;overflow:auto"><table><thead><tr><th>K</th>`;
    fields.forEach(f=>{h+=`<th>${f.h}</th>`});
    h+='</tr></thead><tbody>';
    rows.forEach(r=>{
      const a=Math.abs(r.s-SPOT)<1.5;
      h+=`<tr${a?' class="atm"':''}><td>${r.s}</td>`;
      fields.forEach(f=>{const v=r[f.k];h+=`<td class="${f.d?pc(v):''}">${v!=null?(f.d?sg(v):'')+fD(v,f.p||4):'–'}</td>`});
      h+='</tr>'});
    return h+'</tbody></table></div></div>'}
  let h='<div class="stitle">Variações das Gregas (D-1 → D)</div><div class="g2">';
  h+=mkG('Δ Delta Call / Put',[  {h:'ΔC',k:'dc_delta',d:1,p:4},{h:'C₁',k:'c_delta1',p:4},{h:'C',k:'c_delta2',p:4},{h:'ΔP',k:'dp_delta',d:1,p:4},{h:'P₁',k:'p_delta1',p:4},{h:'P',k:'p_delta2',p:4}]);
  h+=mkG('Δ Gamma Call / Put',[  {h:'ΔC',k:'dc_gamma',d:1,p:6},{h:'C₁',k:'c_gamma1',p:6},{h:'C',k:'c_gamma2',p:6},{h:'ΔP',k:'dp_gamma',d:1,p:6},{h:'P₁',k:'p_gamma1',p:6},{h:'P',k:'p_gamma2',p:6}]);
  h+=mkG('Δ Theta Call / Put',[  {h:'ΔC',k:'dc_theta',d:1,p:4},{h:'C₁',k:'c_theta1',p:4},{h:'C',k:'c_theta2',p:4},{h:'ΔP',k:'dp_theta',d:1,p:4},{h:'P₁',k:'p_theta1',p:4},{h:'P',k:'p_theta2',p:4}]);
  h+=mkG('Δ Vega Call / Put',[   {h:'ΔC',k:'dc_vega',d:1,p:4},{h:'C₁',k:'c_vega1',p:4},{h:'C',k:'c_vega2',p:4},{h:'ΔP',k:'dp_vega',d:1,p:4},{h:'P₁',k:'p_vega1',p:4},{h:'P',k:'p_vega2',p:4}]);
  h+='</div>';
  document.getElementById('vGreeks').innerHTML=h;
}

function renderAgg(){
  if(cur!=='AGG')return;
  const rows=[...AGG].sort((a,b)=>a.s-b.s);
  let h='<div class="stitle">Rankings Agregados (todos os vencimentos)</div><div class="g4">';
  h+=mkRank('🔥 Vol Total D (Agg)',rows,(a,b)=>b.tv-a.tv,[{h:'K',k:'s'},{h:'VolC',fmt:r=>fI(r.cv)},{h:'VolP',fmt:r=>fI(r.pv)},{h:'Total',fmt:r=>'<b>'+fI(r.tv)+'</b>'}]);
  h+=mkRank('📈 ΔVol Total (Agg)',rows,(a,b)=>b.dtv-a.dtv,[{h:'K',k:'s'},{h:'ΔVC',fmt:r=>sg(r.dcv)+fI(r.dcv),cls:r=>pc(r.dcv)},{h:'ΔVP',fmt:r=>sg(r.dpv)+fI(r.dpv),cls:r=>pc(r.dpv)},{h:'ΔT',fmt:r=>'<b>'+sg(r.dtv)+fI(r.dtv)+'</b>',cls:r=>pc(r.dtv)}]);
  h+=mkRank('📊 ΔOI Call (abs, Agg)',rows,(a,b)=>Math.abs(b.dco)-Math.abs(a.dco),[{h:'K',k:'s'},{h:'OI D-1',fmt:r=>fI(r.co1)},{h:'OI D',fmt:r=>fI(r.co2)},{h:'Δ',fmt:r=>'<b>'+sg(r.dco)+fI(r.dco)+'</b>',cls:r=>pc(r.dco)}]);
  h+=mkRank('📊 ΔOI Put (abs, Agg)',rows,(a,b)=>Math.abs(b.dpo)-Math.abs(a.dpo),[{h:'K',k:'s'},{h:'OI D-1',fmt:r=>fI(r.po1)},{h:'OI D',fmt:r=>fI(r.po2)},{h:'Δ',fmt:r=>'<b>'+sg(r.dpo)+fI(r.dpo)+'</b>',cls:r=>pc(r.dpo)}]);
  h+='</div>';
  h+='<div class="stitle">Tabela Agregada por Strike</div><div class="card"><div style="max-height:500px;overflow:auto"><table><thead><tr>'+
    '<th>K</th><th>OI C₁</th><th>OI C</th><th>ΔOI C</th><th>OI P₁</th><th>OI P</th><th>ΔOI P</th>'+
    '<th>VC₁</th><th>VC</th><th>ΔVC</th><th>VP₁</th><th>VP</th><th>ΔVP</th><th>ΔVT</th>'+
    '<th>IVC₁</th><th>IVC</th><th>ΔIVC</th><th>IVP₁</th><th>IVP</th><th>ΔIVP</th></tr></thead><tbody>';
  rows.forEach(r=>{
    const a=Math.abs(r.s-SPOT)<1.5;
    h+=`<tr${a?' class="atm"':''}>
      <td>${r.s}</td>
      <td>${fI(r.co1)}</td><td>${fI(r.co2)}</td><td class="${pc(r.dco)}">${sg(r.dco)}${fI(r.dco)}</td>
      <td>${fI(r.po1)}</td><td>${fI(r.po2)}</td><td class="${pc(r.dpo)}">${sg(r.dpo)}${fI(r.dpo)}</td>
      <td>${fI(r.cv1)}</td><td>${fI(r.cv)}</td><td class="${pc(r.dcv)}">${sg(r.dcv)}${fI(r.dcv)}</td>
      <td>${fI(r.pv1)}</td><td>${fI(r.pv)}</td><td class="${pc(r.dpv)}">${sg(r.dpv)}${fI(r.dpv)}</td>
      <td class="${pc(r.dtv)}"><b>${sg(r.dtv)}${fI(r.dtv)}</b></td>
      <td>${r.c_iv_avg1!=null?r.c_iv_avg1.toFixed(1)+'%':'–'}</td><td>${r.c_iv_avg!=null?r.c_iv_avg.toFixed(1)+'%':'–'}</td>
      <td class="${pc(r.div_c)}">${r.div_c!=null?sg(r.div_c)+r.div_c.toFixed(2)+'pp':'–'}</td>
      <td>${r.p_iv_avg1!=null?r.p_iv_avg1.toFixed(1)+'%':'–'}</td><td>${r.p_iv_avg!=null?r.p_iv_avg.toFixed(1)+'%':'–'}</td>
      <td class="${pc(r.div_p)}">${r.div_p!=null?sg(r.div_p)+r.div_p.toFixed(2)+'pp':'–'}</td></tr>`});
  h+='</tbody></table></div></div>';
  document.getElementById('vAgg').innerHTML=h;
}

function renderAll(){renderTabs();renderViewSel();showViews();renderKPIs();renderRankings();renderTable();renderGreeks();renderAgg();}
renderAll();
</script>
<script>
(function(){
  const btn = document.getElementById('theme-toggle');
  if(document.documentElement.getAttribute('data-theme') === 'dark' && btn) btn.textContent = '☀️';
})();
function toggleTheme(){
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const btn = document.getElementById('theme-toggle');
  if(isDark){
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('bova11-theme','light');
    btn.textContent = '🌙';
  } else {
    document.documentElement.setAttribute('data-theme','dark');
    localStorage.setItem('bova11-theme','dark');
    btn.textContent = '☀️';
  }
}
</script>
